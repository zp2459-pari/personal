name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout code-revivewer
        uses: actions/checkout@v4
        with:
          repository: zp2459-pari/code-revivewer
          path: ../code-revivewer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd ../code-revivewer
          pip install -r requirements.txt

      - name: Run AI Code Review
        env:
          LLM_PROVIDER: kimi
          LLM_API_KEY: ${{ secrets.KIMI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.KIMI_BASE_URL || 'https://api.moonshot.cn/v1' }}
          LLM_MODEL: ${{ secrets.KIMI_MODEL || 'kimi-k2-5' }}
          PROJECT_ROOT: ${{ github.workspace }}
          GIT_MODE: pr
          TARGET_BRANCH: origin/${{ github.base_ref }}
          ENABLE_LINTER: false
          ENABLE_KG: false
          OUTPUT_FORMAT: json
          OUTPUT_REPORT_PATH: ${{ github.workspace }}/review_report.json
        run: |
          cd ../code-revivewer
          python main.py || true

      - name: Post or Update Review Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '${{ github.workspace }}/review_report.json';

            if (!fs.existsSync(path)) {
              console.log('No review report found.');
              return;
            }

            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const verdict = report.verdict || 'WARN';
            const summary = report.summary || 'No summary available.';
            const issues = report.issues || [];
            const meta = report._meta || {};

            let body = `<!-- AI Code Review Report -->\n`;
            body += `## 🤖 AI Code Review Report\n\n`;

            const verdictIcon = verdict === 'PASS' ? '✅' : verdict === 'BLOCKER' ? '❌' : '⚠️';
            body += `| **Verdict** | **Summary** |\n`;
            body += `|-------------|-------------|\n`;
            body += `| ${verdictIcon} **${verdict}** | ${summary} |\n\n`;
            body += `**Model:** ${meta.model || 'N/A'} | **Duration:** ${meta.duration_sec || 'N/A'}s\n`;

            if (issues.length > 0) {
              body += `\n### Issues Found (${issues.length})\n\n`;
              issues.slice(0, 20).forEach((issue, idx) => {
                const sev = issue.severity || 'INFO';
                const cat = issue.category || 'general';
                const file = issue.file || 'unknown';
                const line = issue.line || 0;
                const msg = issue.message || 'No message';
                const suggestion = issue.suggestion || '';
                const icon = sev === 'BLOCKER' ? '🔴' : sev === 'WARN' ? '🟡' : '🔵';
                body += `**${icon} ${idx + 1}. [${sev}] ${cat} - \`${file}:${line}\`**\n`;
                body += `> ${msg}\n`;
                if (suggestion) {
                  body += `\n**Suggestion:** ${suggestion}\n`;
                }
                body += `\n`;
              });
              if (issues.length > 20) {
                body += `*... and ${issues.length - 20} more issues*\n`;
              }
            } else {
              body += `\n✅ No issues found.\n`;
            }

            body += `\n---\n*Generated by [Code Review Agent](https://github.com/zp2459-pari/code-revivewer)*`;

            // Find existing comment to update instead of creating a new one
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existingComment = comments.find(
              c => c.body && c.body.includes('<!-- AI Code Review Report -->')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
              console.log('Updated existing review comment.');
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body,
              });
              console.log('Created new review comment.');
            }
